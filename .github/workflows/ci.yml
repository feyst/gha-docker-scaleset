name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: gofmt -l . | tee /dev/stderr | (! read)
        name: gofmt

      - run: go vet ./...

      - run: go test -race ./...

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build only: publishing happens on a tag, not on every push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
