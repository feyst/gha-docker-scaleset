name: CI

on:
  pull_request:
  push:
    branches:
      - main

# GitHub-hosted on purpose, for every event: this repository is public, and a
# self-hosted runner that shares its host's Docker socket must never run code
# from a fork. It costs nothing, since hosted minutes are free for public
# repositories.
jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! read)

      - run: go vet ./...

      - run: go test -race ./...

  image:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Every published architecture is built here, so a release cannot fail on
      # a platform nobody tried. Building only, publishing is Release's job.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x
          push: false
